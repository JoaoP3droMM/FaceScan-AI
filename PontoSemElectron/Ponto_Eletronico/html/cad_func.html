<!-- Tela que tira a foto do funcionário, e a cadastra no banco de dados, treinando a IA e permitindo
     o reconhecimento facial de forma adequada -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="../script/globalFunction.js" defer></script>
    <script type="module" src="../script/functions.js" defer></script>
    <script type="module" src="../script/cad_func.js" defer></script>    
    <script type="module" src="../script/variables.js" defer></script>

    <title>Cadastro de Funcionário</title>
</head>
<body>

    <!-- Formulário com o conteúdo central da página -->
    <div class="container" id="containerid">
        <h2>Cadastro de Funcionario</h2>
        <form id="formulario-cad-func">
            <div id="form-fields">
                <div class="grupo-formulario" id="matricula-group">
                    <label for="matricula">Matrícula</label>
                    <!-- Deixa o input como obrigatório e já focado ao recarregar a página -->
                    <input type="text" id="matricula" required autofocus> 
                </div>
                <div class="grupo-formulario" id="cpf-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" disabled>
                </div>
                <div class="grupo-formulario">
                    <label for="nomeCompleto">Nome Completo</label>
                    <input type="text" id="nomeCompleto" disabled>
                </div>
                <div class="grupo-formulario">
                    <label for="filial">Filial</label>
                    <input type="text" id="filial" disabled>
                </div>

                <!-- INPUT INVISIVEL DO ID DO FUNCIONARIO FAMOSA GAMBIARRA -->
                <div class="grupo-formulario">
                    <input type="hidden" id="idfunc" readonly>
                </div>
            </div>

            <!-- Secção dos botões de cadastro e o de sair que retorna para a tela de ponto -->
            <div class="botoesFunc">
                <button type="button" id="start-capture" disabled>Cadastrar</button>
                <br><br>
                <button type="button" id="sairCF">Sair</button>    
            </div>
        </form>
        <!-- Fim do formulario central -->


        <!-- Elementos para abrir a câmera e capturar a imagem -->
        <div id="video-container" class="hidden">
            <video id="video" autoplay></video>
            <button type="button" id="cadastro-button"></button>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>        
    </div>

    <!-- Tela de carregamento, indica para o usuaŕio que o sistema está treinando a IA -->
    <div class="telacarregamento hidden" id="telacarregamento">
        <h2><strong>Estudando seu rosto 😉</strong></h2>
        <div class="loading-wave">
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
        </div>
    </div>
</body>
</html>
