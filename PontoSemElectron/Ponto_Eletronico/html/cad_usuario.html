<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">
    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="../script/cad_usuario.js" defer></script>
    <script type="module" src="../script/functions.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Admin</h1>
        <form id="registration-form">
            <div id="form-fields">
                <div class="form-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required>
                </div>
            </div>

            <!-- Alert Falso -->
            <div id="notification" class="notification hidden">
                <p id="notificacao-default"></p>
            </div>

            <button type="submit" id="start-capture">Cadastrar</button>
            <br><br>
            <button type="button" id="sair">Sair</button>         
        </form>
    </div>
    <div class="telacarregamento hidden" id="telacarregamento">
        <div class="loading-wave">
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
        </div>
    </div>
</body>
</html>
