<!-- Núcleo da aplicação. Onde o usuário pode navegar por todo o sistema e interagir com as outras
 telas, podendo assim realizar cadastros e bater o ponto -->


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/ponto.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="../script/ponto.js" defer></script>
    <script type="module" src="../script/functions.js" defer></script>
    <script type="module" src="../script/globalFunction.js" defer></script>
    <script type="module" src="../script/variables.js" defer></script>

    <title>Sistema de Ponto Eletrônico</title>
</head>
<body>

    <!-- Este bloco cria um botão de configurações que, ao ser clicado, exibe links para as páginas 
     de cadastro de funcionário e usuário. -->
    <div class="configuracoes" id="configuracoes">
        <button id="btnConfig"><img src="../assets/config.png" class="configImg"></button>
        <div class="dropdown-config">
            <a href="login_cad_func.html"><strong>Cadastrar Funcionário</strong></a>
            <a href="login_cad_usu.html"><strong>Cadastrar Usuario</strong></a>
            <a href="login_cad_func.html"><strong>Configurações</strong></a>
        </div>
    </div>

    <!-- Bloco principal de reconhecimento -->
    <div class="container" id="container">
        <div class="recognition" id="recognition">
            <h1>Sistema de Ponto Eletrônico</h1>
            <img src="../assets/digital.png" class="digitalIMG">
            <br><br>
            <button id="btnIniciarCamera" type="button" class="btnPonto"><h2>Bater Ponto</h2></button>
            <br>
        </div>
    </div>
    
    <!-- Tela de retorno que irá trazer as informações do funcionário que acabou de bater o ponto -->
    <div class="profile hidden" id="profile">
        <div class="info">
            <p id="funcionario_img"><i class="fa-solid fa-circle-check fa-3x"></i></p>
            <h2>Ponto batido com sucesso!</h2>
            <p><strong>Funcionário: </strong><span id="nomeFuncionario"></span></p>
            <p><strong>CPF: </strong><span id="cpfFuncionario"></span></p>
            <div class="bar"><div class="changebar" id="barraponto"></div></div>
        </div>
    </div>

    <!-- Elementos para captura de imagem -->
    <div id="video-container" class="hidden">
        <video id="video" autoplay></video>
        <button id="btnCapturarImagem" type="button" class="btnCaptura"></button>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Tela de carregamento -->
    <div class="telacarregamento hidden" id="telacarregamento">
        <h2><strong>Iniciando reconhecimento...</strong></h2>
        <div class="loading-wave">
         <div class="loading-bar"></div>
         <div class="loading-bar"></div>
         <div class="loading-bar"></div>
         <div class="loading-bar"></div>
        </div>
    </div>

</body>
</html>
