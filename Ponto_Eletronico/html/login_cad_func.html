<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://code.jquery.com;">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" type="text/css" href="../fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../node_modules/sweetalert2/dist/sweetalert2.min.css">
    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="../script/login_cad_func.js" defer></script> <!-- Corrigido -->
    <script type="module" src="../script/functions.js" defer></script>
    <title>Login - A Casa Brasileira</title>
</head>
<body>
    <div class="botao-voltar">
        <button type="button" id="pagina-ponto"><i class="fa-solid fa-chevron-left"></i></button>
    </div>
    <div class="container">
        <h1>Cadastrar Funcionário</h1>
        <br>
        <img src="../build/logo.png" alt="Logo A Casa Brasileira">
        <br><br>
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Usuário" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            <div class="form-group">
                <div id="notification" class="notification hidden">
                    <p id="notificacao-default"></p>
                </div>
                <button type="submit" id="btnEntrar">ENTRAR</button> <!-- Corrigido -->
            </div>
        </form>
    </div>
    <div class="telacarregamento hidden" id="telacarregamento">
        <div class="loading-wave">
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
        </div>
    </div>
</body>
</html>
