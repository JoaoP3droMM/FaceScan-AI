<div id="modal-update-overlay" class="modal-overlay">
    <div class="modal-card">
        <button class="modal-close-btn" onclick="fecharModalUpdate()">
            <i class="fa-solid fa-circle-xmark"></i>
        </button>

        <div id="view-update-search" style="width: 100%;">
            <h3 style="text-align: center; margin-bottom: 25px; color: #333;">Atualizar Usuário</h3>
            <div class="input-group" style="margin-bottom: 25px;">
                <label for="update-search-input" style="font-weight: 500; margin-bottom: 10px; display: block;">
                    Informe a matrícula do usuário:
                </label>
                <input type="text" id="update-search-input" class="modal-input" placeholder="Ex: 2023001">
            </div>
            <div id="msg-update-feedback" class="feedback-box" style="display: none; margin-bottom: 20px;"></div>
            <button id="btn-update-search-action" class="btn-action btn-blue" style="width: 100%; justify-content: center; padding: 12px;">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar Usuário
            </button>
        </div>

        <div id="view-update-form" style="display: none; width: 100%;">
            <h3 style="text-align: center; margin-bottom: 20px; color: #333;">Editar Dados</h3>
            <div class="modal-form-row" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <div class="input-group">
                    <label>Matrícula (Bloqueado):</label>
                    <input type="text" id="edit-matricula" class="modal-input" readonly style="background-color: #e9ecef; cursor: not-allowed; color: #666;">
                </div>

                <div class="input-group">
                    <label>Nome do Usuário:</label>
                    <input type="text" id="edit-nome" class="modal-input" style="background-color: #fff; border: 1px solid #ccc;">
                </div>

                <div class="input-group">
                    <label>Data de registro:</label>
                    <input type="text" id="edit-data" class="modal-input" readonly style="background-color: #e9ecef; color: #666;">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button onclick="toggleUpdateView('search')" class="btn-action" style="flex: 1; justify-content: center; background-color: #ccc; color: #333;">
                    Voltar
                </button>
                <button id="btn-update-save-action" class="btn-action btn-blue" style="flex: 1; justify-content: center; padding: 12px;">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                </button>
            </div>
        </div>

        <div id="view-update-success" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0;">
            <div class="success-icon-container" style="margin-bottom: 20px;">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 style="color: #000; margin-bottom: 15px;">Atualizado!</h2>
            <p style="text-align: center; color: #333;">
                Os dados do usuário foram atualizados com sucesso.
            </p>
            <p style="font-size: 12px; color: #888; margin-top: 20px;">Fechando...</p>
        </div>
    </div>
</div>
