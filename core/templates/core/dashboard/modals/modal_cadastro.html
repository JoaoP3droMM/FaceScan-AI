<div id="modal-cadastro-overlay" class="modal-overlay">
    <div class="modal-card">
        <button class="modal-close-btn" onclick="fecharModal()">
            <i class="fa-solid fa-circle-xmark"></i>
        </button>
        <div id="view-form">
            <div class="camera-placeholder" style="position: relative; overflow: hidden;">
                <video id="video-preview" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; display: none;"></video>
                <span id="texto-camera" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666;">
                    Câmera desligada
                </span>
            </div>
            <button type="button" id="btn-camera-toggle" class="btn-action btn-blue" style="margin-bottom: 20px; width: 100%; justify-content: center;">
                <i class="fa-solid fa-video"></i> Ligar Webcam
            </button>
            <div id="msg-feedback" class="feedback-box" style="display: none;"></div>
            <div class="modal-form-row">
                <div class="input-group">
                    <label>Nome usuário:</label>
                    <input type="text" id="nome-usuario" class="modal-input">
                </div>
                <div class="input-group">
                    <label>Matrícula:</label>
                    <input type="text" id="matricula-usuario" class="modal-input">
                </div>
            </div>
            <button class="btn-submit-modal">Cadastrar usuário</button>
        </div>
        <div id="view-success" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0;">
            <div class="success-icon-container">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 style="color: #000; margin: 20px 0 10px 0;">Sucesso!</h2>
            <p style="text-align: center; color: #333; margin-bottom: 20px; line-height: 1.5;">
                Usuário <strong id="success-user-id">000</strong> cadastrado com sucesso!<br>
                Iniciando treinamento da IA. Isso pode demorar um pouco...
            </p>
            <div class="loader-spinner"></div>
            <p style="font-size: 12px; color: #888; margin-top: 10px;">Por favor, aguarde...</p>
        </div>
    </div>
</div>
